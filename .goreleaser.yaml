version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    dir: cmd/pwf
    binary: pwf
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "pwf_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Proactive-Software
    name: pwf-cli

brews:
  - name: pwf
    repository:
      owner: Proactive-Software
      name: homebrew-pwf-cli
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Proactive-Software/pwf-cli"
    description: "Personal ProWorkflow CLI"
    license: "MIT"
    install: |
      bin.install "pwf"
    test: |
      system "#{bin}/pwf", "--help"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
